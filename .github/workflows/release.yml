name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish Android release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 37 platform
        shell: bash
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          AGENTPULSE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AGENTPULSE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AGENTPULSE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$AGENTPULSE_KEYSTORE_PASSWORD"
          test -n "$AGENTPULSE_KEY_ALIAS"
          test -n "$AGENTPULSE_KEY_PASSWORD"
          AGENTPULSE_KEYSTORE_PATH="$RUNNER_TEMP/agentpulse-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$AGENTPULSE_KEYSTORE_PATH"
          echo "AGENTPULSE_KEYSTORE_PATH=$AGENTPULSE_KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "AGENTPULSE_KEYSTORE_PASSWORD=$AGENTPULSE_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "AGENTPULSE_KEY_ALIAS=$AGENTPULSE_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "AGENTPULSE_KEY_PASSWORD=$AGENTPULSE_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build Android release
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon test lintRelease assembleRelease bundleRelease

      - name: Package source
        shell: bash
        run: |
          mkdir -p dist
          repository="${GITHUB_REPOSITORY#*/}"
          archive="dist/${repository}-${GITHUB_REF_NAME}-source.tar.gz"
          tar --exclude='.git' --exclude='.git/*' --exclude='./dist' --exclude='*/build' --exclude=target -czf "$archive" .
          shasum -a 256 "$archive" > "${archive}.sha256"

      - name: Collect Android outputs
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            cp "$file" dist/
          done < <(find . -path '*/build/outputs/*' -type f \( -name '*.apk' -o -name '*.aab' \) -print0)

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi

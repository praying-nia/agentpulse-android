name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      run_instrumentation:
        description: Run the Android emulator smoke test
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check repository hygiene
        shell: bash
        run: |
          test -s README.md
          git show --check --format= HEAD

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 37 platform
        shell: bash
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Run Android checks and debug build
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon test lintDebug assembleDebug

      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ github.event.repository.name }}-android-${{ github.sha }}
          path: |
            **/build/outputs/**/*.apk
            **/build/outputs/**/*.aab
          if-no-files-found: warn
          retention-days: 14

      - name: Create CI source snapshot
        id: snapshot
        shell: bash
        run: |
          archive="${RUNNER_TEMP}/${GITHUB_REPOSITORY#*/}-${GITHUB_SHA::12}-source.tar.gz"
          tar --exclude-vcs --exclude='*/build' -czf "$archive" .
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload CI source artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ github.event.repository.name }}-source-${{ github.sha }}
          path: ${{ steps.snapshot.outputs.archive }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  instrumentation:
    name: Emulator smoke test
    if: github.event_name == 'workflow_dispatch' && inputs.run_instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # GitHub-hosted Linux runners expose KVM, but the device node is not
      # consistently writable after image updates. Configure it explicitly so
      # the emulator either uses acceleration or fails during launch.
      - name: Enable KVM acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Install Android 37 platform
        shell: bash
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Build instrumentation APKs
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=1 assembleDebug assembleDebugAndroidTest

      - name: Run instrumentation test
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 12
        with:
          api-level: 35
          arch: x86_64
          target: aosp_atd
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-linux-hw-accel: false
          disable-animations: true
          script: bash .github/scripts/run-emulator-tests.sh

      - name: Print emulator failure diagnostics
        if: failure()
        shell: bash
        run: |
          adb devices -l || true
          adb reconnect offline || true
          adb devices -l || true
          test ! -x "$ANDROID_SDK_ROOT/emulator/emulator" || "$ANDROID_SDK_ROOT/emulator/emulator" -accel-check || true
          find "$HOME/.android/avd" -maxdepth 2 -type f \( -name '*.ini' -o -name '*.log' \) -print -exec tail -n 200 {} \; 2>/dev/null || true

      - name: Upload emulator failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: emulator-diagnostics-${{ github.sha }}
          path: |
            ~/.android/avd/**/*.ini
            ~/.android/avd/**/*.log
            /tmp/android-emulator-runner/**
          if-no-files-found: warn
          retention-days: 7
